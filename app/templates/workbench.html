<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>统一清算席</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/market.css">
  <script type="module" src="/static/workspace.js"></script>
</head>
<body class="market">
  <div class="workbench">
    <aside class="rail">
      <a class="brand" href="/"><span aria-hidden="true">⋮</span><b>统一清算席</b></a>
      <nav aria-label="业务模块">
        {% for slug, label in tabs.items() %}<a href="#{{ slug }}" data-module="{{ slug }}">{{ label }}</a>{% endfor %}
      </nav>
      <small>再生资源交易市场结算员</small>
    </aside>
    <div class="desk">
      <header class="toolbar"><span>竞价场次</span><span class="edition">规则 1.0</span><a class="btn" id="export" hidden>导出证据</a></header>
      <main>
        <section class="mast"><div class="clock"><small>场次清算</small><time id="created"></time></div><h1>统一清算席</h1></section>
        <section class="kpis" aria-label="批次指标"><div class="kpi"><small>净差</small><strong data-count="delta">—</strong><span>元</span></div>
<div class="kpi"><small>账差</small><strong data-count="mismatched">—</strong><span>条</span></div>
<div class="kpi"><small>有效</small><strong data-count="accepted">—</strong><span>条</span></div>
<div class="kpi"><small>隔离</small><strong data-count="rejected">—</strong><span>条</span></div>
<div class="kpi"><small>来源记录</small><strong data-count="input">—</strong><span>条</span></div>
        </section>
        <div class="grid">
    <section class="panel results" aria-labelledby="phase">
      <div class="panel__head"><h2 id="phase">竞价清算</h2><span class="num" id="run-id"></span></div>
      <div id="tools" class="filters" hidden><label>筛选 <input id="filter" type="search" placeholder="竞价场次 / 原因" maxlength="80"></label>
        <label id="only-differences" hidden><input id="differences" type="checkbox"> 只看差异</label><output id="shown"></output></div>
      <div class="scroll" id="grid-data"><p class="empty">运行本班样例</p></div>
      <form id="review" class="panel__body" hidden>
        <label>复核意见 <textarea id="review-note" maxlength="500" rows="2"></textarea></label>
        <div class="actions"><label>结论 <select id="decision"><option>确认</option><option>退回</option></select></label>
        <button class="btn btn--primary" type="submit">提交复核</button></div>
      </form>
      <form id="correction" class="panel__body" hidden>
        <p class="empty" id="correction-hint">批次须先在「市场签核」确认后，才能登记晚到更正。</p>
        <label>更正场次 <input id="correction-target" type="text" maxlength="80" placeholder="如 00102"></label>
        <label>更正原因 <textarea id="correction-note" maxlength="500" rows="2" placeholder="说明哪条报单填错、晚到原因"></textarea></label>
        <label>更正后来源 CSV <textarea id="correction-csv" rows="5" placeholder="粘贴完整来源；除目标场次外其余行须与原批次逐行一致"></textarea></label>
        <label>外账（可空，缺省沿用原批次） <textarea id="correction-book" rows="3" placeholder="补登外账后可在冲销单上重新按场核对"></textarea></label>
        <div class="actions"><button class="btn btn--primary" type="submit">登记更正并生成冲销单</button></div>
      </form>
    </section>

    <section class="panel source" aria-labelledby="input-title">
      <div class="panel__head"><h2 id="input-title">竞价记录</h2><small>CSV</small></div>
      <form id="source" class="panel__body">
        <div class="actions"><button type="submit" class="btn btn--primary">运行竞价清算</button>
        <button type="button" id="sample" class="btn">载入样例</button></div>
        <details><summary>导入来源与外部账</summary>
          <label>来源文件 <input id="source-file" type="file" accept=".csv,text/csv"></label>
          <textarea id="source-csv" aria-label="原始记录 CSV" rows="4"></textarea>
          <label>外部账 <input id="book-file" type="file" accept=".csv,text/csv"></label>
          <textarea id="book-csv" aria-label="外部账 CSV" rows="4"></textarea>
        </details>
        <output id="notice" role="status"></output>
      </form>
    </section>

    <article class="panel signal" id="evidence-panel" data-instrument="levels">
      <div class="panel__head"><h2>成交配给</h2><span class="num" id="evidence-key"></span></div>
      <div class="panel__body" id="signal" aria-live="polite"><p class="empty">选择一条复算记录</p></div>
    </article></div>
      </main>
      <footer class="statusbar"><span id="state" role="status">等待输入</span><a href="/openapi.json">接口</a><span>UTC</span></footer>
    </div>
  </div>
  <script type="application/json" id="settings">{{ {'reasons': reasons, 'tabs': tabs, 'unit': unit, 'key': key}|tojson }}</script>
</body>
</html>
